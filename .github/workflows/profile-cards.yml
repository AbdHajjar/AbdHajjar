name: Update profile cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/profile-cards.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # PAT (secret "PAT", scope repo + read:user) lets the cards count private repos; falls back to public-only.
      CARD_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
      GH_USER: ${{ github.repository_owner }}
    steps:
      - run: mkdir dist

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark
            dist/snake-light.svg?palette=github-light

      - name: Stats card (dark)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ env.GH_USER }}&show_icons=true&count_private=true&include_all_commits=true&hide_border=true&theme=github_dark
          path: dist/stats-dark.svg
          token: ${{ env.CARD_TOKEN }}

      - name: Stats card (light)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ env.GH_USER }}&show_icons=true&count_private=true&include_all_commits=true&hide_border=true&theme=default
          path: dist/stats-light.svg
          token: ${{ env.CARD_TOKEN }}

      - name: Top languages (dark)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ env.GH_USER }}&layout=compact&langs_count=10&hide_border=true&theme=github_dark
          path: dist/top-langs-dark.svg
          token: ${{ env.CARD_TOKEN }}

      - name: Top languages (light)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ env.GH_USER }}&layout=compact&langs_count=10&hide_border=true&theme=default
          path: dist/top-langs-light.svg
          token: ${{ env.CARD_TOKEN }}

      - name: Push cards to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
